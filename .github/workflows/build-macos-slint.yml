name: Build MacOS [Slint]
# ALSO SEE: pyicu: https://github.com/googlefonts/pyfontaine/issues/109

on:
  push:
    branches:
      - 'build-release'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: 0
  PYTHONWARNINGS: ignore::EncodingWarning
  PYTHONWARNDEFAULTENCODING: 0
  APPNAME: PyGlossarySlint
  DIST_DIR: dist.nuitka.slint
  SLINT_VERSION: 1.18.1b1
  HOMEBREW_NO_INSTALL_CLEANUP: true
  HOMEBREW_NO_ENV_HINTS: true
  HOMEBREW_CLEANUP_MAX_AGE_DAYS: 999
  HOMEBREW_NO_ANALYTICS: true
  HOMEBREW_NO_AUTO_UPDATE: true
  MAIN_SCRIPT: main.py
  RESOURCE_DIR: "resources"

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}

    strategy:
      # DOC: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow
      matrix:
        python-version: ['3.13']
        os:
          # - macos-14
          - macos-15
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true
          # TODO: !!! comment out before merging to master
          # ref: build-release

      - name: Update brew
        run: brew update

      - name: Install brew dependencies
        run: python3 scripts/ci/mac/slint/build.py deps-brew

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        # https://docs.astral.sh/uv/guides/integration/github/#caching
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-slint-${{ matrix.python-version }}

      - name: Create venv
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python3 scripts/ci/mac/slint/build.py venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: set vars
        id: envconf
        run: |
          echo "VERSION=$(git describe --abbrev=0)" >> $GITHUB_ENV
          echo "VERSION_WITH_HASH=$(git describe)" >> $GITHUB_ENV

      - name: Install pyglossary dependencies
        run: python3 scripts/ci/mac/slint/build.py deps-python

      - name: Patch sources for nuitka build
        run: python3 scripts/ci/mac/slint/build.py patch

      - name: nuitka Build
        env:
          PYTHONWARNDEFAULTENCODING: 0
        run: python3 scripts/ci/mac/slint/build.py nuitka-build

      - name: Copy assets
        run: python3 scripts/ci/mac/slint/build.py copy-assets

      - name: Create DMG
        run: python3 scripts/ci/mac/slint/build.py dmg

      - name: Upload Artifacts DMG
        if: true
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs#github-context
          name: ${{ github.event.repository.name }}-slint-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.sha }}-${{ env.VERSION_WITH_HASH }}-DMG
          path: |
            **/*.dmg

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # ref: build-release # comment out before merge

      - name: Set release vars
        run: |
          echo "VERSION=$(git describe --abbrev=0)" >> $GITHUB_ENV
          echo "VERSION_WITH_HASH=$(git describe)" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Show generated artifacts
        run: |
          pwd
          echo ${{ github.workspace }}/artifacts
          find ${{ github.workspace }}/artifacts

      - name: Skip artifacts that already exist on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.VERSION }}
        run: python3 scripts/ci/release/skip-existing-assets.py

      - name: update release
        uses: ncipollo/release-action@v1
        # https://github.com/ncipollo/release-action
        with:
          name: ${{ env.VERSION }}
          artifacts: "artifacts/*.dmg"
          artifactContentType: application/zip
          generateReleaseNotes: true
          makeLatest: true
          allowUpdates: true
          omitBodyDuringUpdate: true # preserve the existing body during updates:
          tag: ${{ env.VERSION }}
